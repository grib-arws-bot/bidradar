# BidRadar 스테이징(로컬) 빌드/배포 (2026-09-10)
#
# D:\Code-CLI\ARWS\.github\workflows\deploy-stg.yml의 구조를 그대로 복제한다(CLAUDE.md
# "infra/·scripts/deploy-to-production.ps1·.github/workflows/는 ARWS 구조를 복제" 원칙,
# 의사결정_로그 6번). self-hosted 러너는 ARWS와 공유하지 않고 BidRadar 전용으로 별도 등록한다
# (의사결정_로그 94번) — 라벨 "bidradar"로 식별.
#
# 실행 방법: GitHub Actions 탭 → "Deploy - Staging" → "Run workflow" 버튼 클릭.
# 프로덕션 배포는 이 워크플로우가 아니라 deploy-prod.yml(수동 트리거)에서 별도로 한다.

name: Deploy - Staging

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build-and-stage:
    name: 로컬 빌드 + 스테이징 배포
    runs-on: [self-hosted, bidradar]
    # 2026-09-14 — deploy-prod.yml과 같은 이유로 30분으로 상향(pytest가 500건대로 늘어나며
    # 20분 상한에 실제로 걸림).
    # 2026-09-16 — 코사인 유사도 매칭(torch+bge-m3, 의사결정_로그 159번)으로 backend 이미지가
    # 660MB→9.68GB가 되며 30분 상한에 실제로 다시 걸림(빌드 도중 강제 취소됨). git의 CRLF
    # 변환으로 Dockerfile 등 텍스트 파일 바이트가 로컬 빌드 때와 달라지면 Docker 레이어
    # 캐시가 깨져 토치·모델을 처음부터 다시 받을 수 있다는 점까지 고려해 60분으로 상향.
    timeout-minutes: 60
    # 2026-09-15 — docker-compose.yml의 `name: bidradar`가 고정돼 있어(2026-09-01 ARWS와의
    # 충돌 방지용 고정) 개발자가 로컬 PC에서 `docker compose up -d`로 띄워둔 dev 스택과 이
    # CI 잡이 완전히 같은 컨테이너 이름을 두고 경합했다 — 실제로 이 잡의 "스테이징(로컬) 기동"
    # 단계가 개발자의 로컬 backend/frontend/scheduler 컨테이너를 조용히 이 잡의 체크아웃
    # 코드로 바꿔치기하는 사고가 있었다. COMPOSE_PROJECT_NAME과 포트를 로컬 기본값과 다르게
    # 줘서 완전히 별도의 스택으로 띄운다 — db도 별도라 마이그레이션을 이 잡 안에서 직접 돈다.
    env:
      COMPOSE_PROJECT_NAME: bidradar-stg
      DB_HOST_PORT: "15433"
      # 2026-09-16 -- this was 13001, but Windows regenerates a Hyper-V dynamic port
      # exclusion range on every reboot; after today's reboot that range happened to be
      # 12939-13038, which swallowed 13001 and made docker's port bind fail ("access
      # forbidden by its access permissions" -- the classic symptom, fixable by restarting
      # the winnat service, which needs admin rights this session doesn't have). Moved to
      # 14001 to unblock now; if this recurs on a future reboot, `net stop winnat && net
      # start winnat` (as Administrator) is the real fix, or pick yet another free port.
      BACKEND_HOST_PORT: "14001"
      FRONTEND_HOST_PORT: "13201"
      DATABASE_URL: postgresql+psycopg://bidradar:devpassword@127.0.0.1:15433/bidradar
    steps:
      - name: main 브랜치인지 확인
        if: github.ref != 'refs/heads/main'
        shell: bash
        run: |
          echo "::error::이 워크플로우는 main 브랜치에서 트리거됐을 때만 실행할 수 있습니다(실제 ref: ${{ github.ref }}) — self-hosted 러너에 이미 있는 실제 .env(라이브 시크릿)로 검토 안 된 브랜치의 코드를 빌드/실행하는 걸 막기 위함입니다."
          exit 1

      - uses: actions/checkout@v4

      # actions/checkout은 매번 새 작업 디렉터리로 클린 체크아웃하므로(.env는 gitignore라 없음),
      # 이 단계 없이 바로 docker compose를 돌리면 ${VAR} 치환 값이 전부 빈 문자열이 된다(ARWS
      # 2026-08-09 실제 발생 사고와 동일한 클래스) — 실제 관리되는 .env를 그대로 복사해 쓴다.
      - name: .env 파일 준비(스테이징 시크릿)
        shell: powershell
        run: Copy-Item -Path "D:\Code-CLI\BidRadar\infra\.env" -Destination "infra\.env" -Force

      # 2026-09-15 — 이 잡 전용 격리된 db(COMPOSE_PROJECT_NAME=bidradar-stg, 포트 15433)라
      # 개발자의 로컬 dev DB(15432)와 무관하다. 매 실행마다 이미지가 같으면 기존 볼륨을 그대로
      # 재사용하므로(잡이 끝나도 컨테이너를 안 지움) 두 번째 실행부터는 사실상 멱등하지만,
      # 최초 실행이거나 볼륨이 지워졌으면 빈 DB이므로 바로 다음 단계에서 마이그레이션을 돈다.
      - name: DB 컨테이너 기동 확인
        shell: powershell
        working-directory: infra
        run: docker compose up -d db

      - name: DB 마이그레이션
        shell: powershell
        working-directory: backend
        run: |
          python -m pip install -e ".[dev]"
          python -m alembic upgrade head

      # 2026-09-15 — 격리 도입 첫 실행에서 실패로 발견: pytest 중 여러 테스트(test_reports.py의
      # grib_customer_id 등)가 "그립 자신"(plan_tier=internal) 고객이 이미 있다고 가정한다 —
      # 계속 같은 로컬 dev DB를 썼을 땐 늘 있었지만, 이제 이 db는 매번 스키마만 있는 새
      # 프로젝트라 아무도 시드한 적이 없다. seed-if-empty(app/cli.py)는 고객이 하나도 없을
      # 때만(최초 1회) run_seed()를 돈다 — run_seed() 자체는 멱등하지 않아(무조건 INSERT)
      # 매번 그대로 부르면 데모 데이터가 계속 쌓이기 때문.
      - name: 시드 데이터 확인(최초 1회만)
        shell: powershell
        working-directory: backend
        run: python -m app.cli seed-if-empty

      - name: 백엔드 테스트 (pytest)
        shell: powershell
        working-directory: backend
        run: python -m pytest

      - name: 프론트엔드 빌드 확인 (타입체크 포함)
        shell: powershell
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 이미지 빌드 (backend, frontend, scheduler)
        shell: powershell
        working-directory: infra
        run: docker compose build backend frontend scheduler

      - name: 스테이징(로컬) 기동
        shell: powershell
        working-directory: infra
        run: docker compose up -d --no-deps backend frontend scheduler

      - name: 스테이징 응답 확인
        shell: powershell
        run: |
          Start-Sleep -Seconds 5
          $resp = Invoke-WebRequest -Uri "http://127.0.0.1:${env:FRONTEND_HOST_PORT}/" -UseBasicParsing -TimeoutSec 10
          Write-Host "staging frontend: HTTP $($resp.StatusCode)"
          Write-Host ""
          # 2026-09-15 -- this step's Write-Host text is kept plain ASCII on purpose. Korean
          # text here has twice broken PowerShell parsing on this self-hosted runner (Windows
          # PowerShell 5.1 misreads the non-BOM UTF-8 workflow file under its ANSI codepage,
          # and some byte sequences of Korean/punctuation text collide into what looks like an
          # unterminated string). This is CI console output for the operator, not user-facing
          # product text or a commit message, so CLAUDE.md's Korean-text rule does not apply
          # here -- keep it ASCII-only rather than re-guessing which character is unsafe.
          Write-Host "==> All checks passed (tests / build / local boot / response check)."
          Write-Host "    If this looks good, run 'Deploy - Production' from the GitHub Actions tab."
          Write-Host "    (Optional manual look: http://127.0.0.1:${env:FRONTEND_HOST_PORT}/ )"

      - name: .env 파일 정리(시크릿 잔존 방지)
        if: always()
        shell: powershell
        run: Remove-Item -Path "infra\.env" -Force -ErrorAction SilentlyContinue
