[project]
name = "bidradar-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "alembic>=1.13,<1.14",
    "pydantic-settings>=2.5,<2.6",
    "argon2-cffi>=23.1,<23.2",
    "requests>=2.32,<2.33",
    "jsonpath-ng>=1.6,<1.7",
    "pypdf>=5.0,<5.1",
    "olefile>=0.47,<0.48",
    # HWP5(현재 정부 사이트 표준 HWP 포맷) 전문 추출 — LibreOffice엔 구버전(Hangul WP 97) 필터만
    # 있고 HWP5는 못 열어(2026-09-04 실측) pyhwp(hwp5txt CLI)로 대체.
    "pyhwp>=0.1b15,<0.2",
    "six>=1.16,<2",  # pyhwp가 six를 쓰지만 자체 의존성 선언이 안 돼 있어 직접 명시
    "python-multipart>=0.0.12,<0.1",  # 고객 소개서 다중 파일 업로드(FastAPI UploadFile)에 필요
    "apscheduler>=3.10,<3.11",  # app/scheduler.py — 소스별 schedule_times 실행 엔진(별도 프로세스)
    "pytesseract>=0.3,<0.4",  # document_extract.py — 이미지·스캔본 PDF OCR(Tesseract 바인딩, 시스템 tesseract-ocr 필요)
    "pillow>=11.0,<13.0",  # OCR 대상 이미지 로딩(pytesseract 입력)
    "pymupdf>=1.24,<1.29",  # 스캔본 PDF 페이지를 이미지로 렌더링(OCR 폴백 전용) — poppler 불필요
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<8.4",
    "httpx>=0.27,<0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
