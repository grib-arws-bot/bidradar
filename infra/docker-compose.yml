# BidRadar 로컬(stg) 개발용 docker-compose. ARWS infra/ 구조를 복제하되 n8n·Baserow는 없음
# (의사결정_로그 2번).
#
# ⚠️ 2026-09-01 사고 기록: 이 폴더명이 ARWS의 infra/와 동일("infra")하고, docker compose가
# 기본으로 "폴더명"을 프로젝트명으로 쓰기 때문에, 최초 작성 시 `name:`을 지정하지 않아
# ARWS의 실제 운영 backend 컨테이너(infra-backend-1)가 BidRadar 이미지로 잠깐 교체되는
# 사고가 있었음(즉시 ARWS 쪽에서 재기동해 복구함). 재발 방지를 위해 프로젝트명을 명시 고정한다.
name: bidradar

services:
  db:
    # 2026-09-16 — pgvector 확장을 쓰기 위해 postgres:16.4-bookworm에서 pgvector/pgvector로
    # 교체(코사인 유사도 매칭, 의사결정_로그 157/158번 후속). 같은 Postgres 16 + Debian
    # bookworm 베이스에 pgvector 확장만 미리 빌드해 넣은 드롭인 이미지라 데이터 포맷 변경
    # 없음 — 버전 고정(CLAUDE.md "latest 태그 금지").
    image: pgvector/pgvector:0.8.0-pg16-bookworm
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bidradar}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-bidradar}
      - POSTGRES_DB=${POSTGRES_DB:-bidradar}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bidradar}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      # 로컬 개발 편의용(psql 직접 접속). prod는 이 포트를 열지 않음(docker-compose.prod.yml, U16).
      # 2026-09-15 — 환경변수로 뺌(기본값은 그대로 15432, 로컬 개발엔 영향 없음). stg 배포
      # 워크플로우가 COMPOSE_PROJECT_NAME과 함께 이 값을 다른 포트로 지정해, 개발자가 로컬에서
      # 계속 띄워둔 dev 스택과 겹치지 않는 완전히 별도의 컨테이너로 stg를 띄운다(의사결정_로그
      # 참고 — 이전엔 stg CI가 dev 컨테이너를 조용히 가로채 자기 코드로 바꿔치기하는 사고가 있었음).
      - "127.0.0.1:${DB_HOST_PORT:-15432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ../backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-bidradar}:${POSTGRES_PASSWORD:-bidradar}@db:5432/${POSTGRES_DB:-bidradar}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-report@grib.co.kr}
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH}
      # 앱 인증 로직은 ADMIN_PASSWORD_HASH만 쓴다 — 이 평문 값은 scripts/deploy-to-production.ps1의
      # 배포 후 로그인 스모크 테스트 전용(컨테이너 안에서 실제 로그인 API를 호출해보는 용도,
      # ARWS deploy-to-production.ps1과 동일 패턴). stg는 보통 비워둬도 무방.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # 보고서 이메일 발송(2026-09-12) — 하이웍스 SMTP(ARWS와 동일). 미설정이면 발송 API가
      # 501로 명시적으로 거부한다(조용히 실패하지 않음, app/services/mailer.py).
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-report@grib.co.kr}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:13200}
    ports:
      # 브라우저는 이 포트를 직접 호출하지 않음(nginx가 /api를 리버스 프록시, U3에서 추가) —
      # 지금은 로컬 개발 편의를 위해서만 127.0.0.1로 제한 노출. 2026-09-15 — DB_HOST_PORT와
      # 같은 이유로 환경변수화.
      - "127.0.0.1:${BACKEND_HOST_PORT:-13000}:3000"
    volumes:
      # 컨테이너 재생성에도 남는 영속 로그(app/logging_config.py, 2026-09-14) — .gitignore의
      # "logs/"에 걸려 커밋 안 됨.
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  # backend와 같은 이미지, 별도 프로세스(CLAUDE.md 기술스택) — source.schedule_times에 지정된
  # 시각(Asia/Seoul 기준)마다 app/scheduler.py가 해당 소스를 자동 수집한다(2026-09-10 도입).
  # API 서버(backend)와 완전히 분리된 컨테이너라 uvicorn 재시작·스케일링과 무관하게 스케줄이
  # 정확히 한 번씩만 등록된다.
  scheduler:
    build: ../backend
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-bidradar}:${POSTGRES_PASSWORD:-bidradar}@db:5432/${POSTGRES_DB:-bidradar}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # 2026-09-17 -- 고객 보고서 자동발송(run_due_customer_emails)이 이 scheduler 프로세스
      # 안에서 도는데, backend 서비스에만 SMTP_* 를 넣어놔서 여기선 SMTP_HOST가 항상
      # 빈 문자열이었다 -- 예약 발송이 실제로 걸린 순간(오늘 13:00 KST)에야 "SMTP 미설정"으로
      # 실패하는 게 로그로 드러났다(재시도 로직이 없어 그 분(分)을 놓치면 다음 예정 시각까지
      # 그냥 넘어간다). backend와 동일하게 맞춘다.
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-report@grib.co.kr}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:13200}
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ../frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    ports:
      # 브라우저가 실제로 보는 유일한 포트. /api는 nginx.conf가 backend로 프록시. 2026-09-15 —
      # DB_HOST_PORT와 같은 이유로 환경변수화.
      - "127.0.0.1:${FRONTEND_HOST_PORT:-13200}:80"
    depends_on:
      - backend

volumes:
  db_data:
