# prod 전용 TLS 종료 프록시 (2026-09-10, ARWS의 동일 구조를 복제 — 의사결정_로그 6번/95번)
#
# BidRadar는 ARWS와 달리 새 서비스라 재사용할 기존 NAT 규칙이 없다 — 관리자에게 신규 외부 포트를
# 요청해야 한다(advisory/server/ 배포가이드, 의사결정_로그 참고). frontend 컨테이너(nginx)가 이미
# /api를 backend로 리버스 프록시하므로, 노출할 포트는 이 하나(3300)뿐이다 — ARWS처럼 앱별로 여러
# 개 열 필요가 없다.
#
# nginx는 proxy_pass에 호스트명을 직접 쓰면 설정 로드 시점에 딱 한 번만 DNS를 resolve한다 —
# 컨테이너 기동 초기의 짧은 타이밍에 그 순간 resolve가 실패하면 nginx가 시작 자체를 거부하고
# 계속 재시작을 반복한다(ARWS 2026-08-11 실제 발생 사고, "host not found in upstream"). resolver +
# 변수 방식으로 요청이 올 때마다 새로 resolve해서 이 문제를 피한다.
resolver 127.0.0.11 valid=10s;

server {
    listen 3300 ssl;
    server_name thingx.grib-iot.com localhost;

    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;

    # frontend/nginx.conf와 동일한 이유(의사결정_로그 61번) — 이 앞단 프록시에도 같은 상한을
    # 걸어야 한다. 2026-09-10 tls-proxy 신설 시 누락되어 고객 소개서 업로드(18MB)가 413으로
    # 막힘(2026-09-11 재발 확인).
    client_max_body_size 100M;

    # 내부용 임시 리포트(2026-09-14) — BidRadar 앱과 무관한 1회성 문서를 인증 없이 정적으로
    # 서빙한다. 로그인 게이트가 없으므로 파일명 자체를 추측 불가능한 토큰으로 지어 URL 비밀로
    # 접근을 제한한다(앱의 공개 리포트 /r/{token}과 같은 방식) — 디렉터리 목록은 반드시 꺼둔다.
    location /internal-reports/ {
        alias /usr/share/nginx/internal-reports/;
        autoindex off;
    }

    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
