# React Router(SPA) — 새로고침 시 /notices/123 같은 경로도 index.html로 fallback해야 함.
# /api는 backend 컨테이너(포트 3000)로 리버스 프록시 — 브라우저는 이 컨테이너 하나만 보고,
# 백엔드는 노출되지 않는다. CORS 설정 자체가 불필요(CLAUDE.md).

# nginx는 proxy_pass에 호스트명을 직접 쓰면 설정 로드 시점에 딱 한 번만 DNS를 resolve해
# 캐시한다 — backend 컨테이너를 재배포(재생성)하면 새 내부 IP를 받는데, frontend는 재기동
# 전까지 옛 IP로 계속 연결을 시도해 502가 난다(2026-09-11 실제 발생 — 배포 때마다 frontend도
# 같이 재기동해야 하는 걸 몰라서 재현). infra/tls-proxy/nginx.conf와 동일한 해법: resolver +
# 변수 방식으로 요청이 올 때마다 새로 resolve한다.
resolver 127.0.0.11 valid=10s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 고객 소개서 다중 파일 업로드(app/services/customer_management.py MAX_DOCUMENT_BYTES=20MB
    # 파일당) — nginx 기본값(1MB)이 그보다 훨씬 작아 413으로 막혔었다. 여러 파일을 한 번에
    # 올리면 요청 전체 크기가 파일 하나 상한보다 커지므로 여유를 두고 100M로 설정.
    client_max_body_size 100M;

    location /api/ {
        # proxy_pass에 변수를 쓰면 location 접두사 치환(스트리핑)이 아예 안 먹혀 원본
        # 요청 URI를 그대로 이어붙인다 — 뒤에 "/api/"를 또 붙이면 "/api//api/health"처럼
        # 접두사가 중복돼 backend가 404를 낸다(2026-09-11 실제 발생). backend 라우트가
        # 이미 "/api/..." 전체 경로로 등록돼 있으므로(app/main.py) 변수만 남기고 원본
        # URI를 그대로 전달한다.
        set $upstream_backend http://backend:3000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ARWS에서 겪은 사고(의사결정_로그 6번) 재현 방지: 앞단 TLS 프록시가 이미 설정한
        # X-Forwarded-Proto를 그대로 전달하고, 없을 때만(로컬/stg처럼 앞단 프록시가 없는 경우)
        # 이 홉의 실제 스킴으로 폴백. $scheme으로 무조건 덮어쓰면 prod에서 세션 쿠키에 Secure
        # 플래그가 안 붙는 버그가 남는다.
        set $forwarded_proto $scheme;
        if ($http_x_forwarded_proto) {
            set $forwarded_proto $http_x_forwarded_proto;
        }
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
